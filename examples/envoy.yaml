# Example Envoy configuration for envoy-vault-jwt. Every host, role, path, and
# identity is fictional. Replace the values with your deployment values.
#
# Place libvault_jwt.so where ENVOY_DYNAMIC_MODULES_SEARCH_PATH points, for
# example /usr/local/lib/envoy-vault-jwt.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: outbound
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: outbound
          route_config:
            name: outbound
            virtual_hosts:
            - name: payments
              domains: ["payments.example.com"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: payments_api, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/vault_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: vault_jwt
                    dynamic_module_config: { name: vault_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true}
            - name: open
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: payments_api, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.dynamic_modules/vault_jwt
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              filter_name: vault_jwt
              dynamic_module_config:
                name: vault_jwt
                metrics_namespace: vault_jwt
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "vaultCluster": "vault",
                    "vaultAuthority": "vault.example.com:8200",
                    "authMount": "kubernetes",
                    "authRole": "payments-workload",
                    "tokenRole": "payments-machine",
                    "kubernetesTokenPath": "/var/run/secrets/vault/token",
                    "expectedIssuer": "https://vault.example.com/v1/identity/oidc",
                    "expectedAudience": "payments-api",
                    "expectedClaims": {"namespace": "payments"},
                    "headerName": "x-machine-token",
                    "refreshMarginSeconds": 60,
                    "minRemainingSeconds": 30,
                    "maxTokenLifetimeSeconds": 3600
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: vault
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: vault
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: vault.example.com, port_value: 8200 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: vault.example.com
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/envoy/certs/vault-ca.pem
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: "vault.example.com" }

  - name: payments_api
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: payments_api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: payments-api.example.com, port_value: 8080 }
