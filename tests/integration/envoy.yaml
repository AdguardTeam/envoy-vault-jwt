  clusters:
  - name: vault
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: vault
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8200 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: vault.example.com
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: __CERT_DIR__/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: "vault.example.com" }

