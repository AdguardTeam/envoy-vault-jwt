# End-to-end test configuration. All hosts, paths, roles, and identities are
# fictional. The test script replaces __CERT_DIR__ and __TOKEN_PATH__ before it
# starts Envoy. Each listener owns one dynamic module filter config, so each
# listener has its own credential cache.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: main
    address:
      socket_address: { address: 127.0.0.1, port_value: 8181 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: main
          use_remote_address: false
          route_config:
            name: main
            virtual_hosts:
            - name: app
              domains: ["app.example.com"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_upstream, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/vault_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: vault_jwt
                    dynamic_module_config: { name: vault_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true}
            - name: reports
              domains: ["reports.example.com"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: reports_upstream, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/vault_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: vault_jwt
                    dynamic_module_config: { name: vault_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true}
            - name: open
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_upstream, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.dynamic_modules/vault_jwt
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              filter_name: vault_jwt
              dynamic_module_config:
                name: vault_jwt
                metrics_namespace: vault_jwt
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "vaultCluster": "vault",
                    "vaultAuthority": "vault.example.com:8200",
                    "authMount": "kubernetes",
                    "authRole": "payments-workload",
                    "tokenRole": "payments-machine",
                    "kubernetesTokenPath": "__TOKEN_PATH__",
                    "expectedIssuer": "https://vault.example.com/v1/identity/oidc",
                    "expectedAudience": "payments-api",
                    "headerName": "x-machine-token",
                    "refreshMarginSeconds": 60,
                    "minRemainingSeconds": 30,
                    "maxTokenLifetimeSeconds": 0,
                    "requestTimeoutMs": 2000,
                    "retryInitialBackoffMs": 100,
                    "retryMaxBackoffMs": 1000,
                    "maxPendingRequests": 128,
                    "maxKubernetesTokenBytes": 65536,
                    "maxVaultResponseBytes": 65536
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

