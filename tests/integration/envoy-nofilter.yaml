# Baseline for the measurement stage: the same listener, routes, and upstreams
# as envoy.yaml, with the dynamic module filter removed. Ports differ so both
# Envoys can run at the same time.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9902 }

static_resources:
  listeners:
  - name: baseline
    address:
      socket_address: { address: 127.0.0.1, port_value: 8182 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: baseline
          use_remote_address: false
          route_config:
            name: baseline
            virtual_hosts:
            - name: app
              domains: ["app.example.com"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_upstream, timeout: 0s }
            - name: open
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_upstream, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: app_upstream
    type: STATIC
    connect_timeout: 5s
    load_assignment:
      cluster_name: app_upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8080 }
