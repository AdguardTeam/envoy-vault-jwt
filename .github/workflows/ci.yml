name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for infrastructure values and key material
        run: scripts/audit-values.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Unit tests with ASan and UBSan
        run: |
          docker buildx build \
            --target test \
            --cache-from type=gha,scope=test \
            --cache-to type=gha,mode=max,scope=test \
            .

      - name: End-to-end tests with a real Envoy process
        run: |
          docker buildx build \
            --target e2e \
            --cache-from type=gha,scope=e2e \
            --cache-to type=gha,mode=max,scope=e2e \
            .
